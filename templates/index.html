<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('/static/imagenzinha.jpg');
            background-size: auto 100vh;
            background-repeat: repeat-x;
            animation: moverMatriz 25s linear infinite;
        }

        @keyframes moverMatriz {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: -1000px 0;
            }
        }

        .titulo-principal {
            color: #000000;                /* Dica: mude para branco para destacar no fundo escuro */
            font-size: 32px;        
            text-align: center;  
            background-color: transparent; /* Fundo 100% transparente */
            padding: 15px;          
            border-radius: 8px;     
}

        .coisa-bonita {
            color: #000000;  
            font-size: 15px;        
            text-align: center;
            background-color: #ffecec; 
            padding: 10px;          
            border-radius: 5px;
        }
    </style>
</head> 
<body>
    <h2 class="titulo-principal">Cadastro de Usuário</h2>
    
    <form action="/submit" method="POST">
        <input class="coisa-bonita" type="text" id="nome" name="nome" placeholder="Coloque seu nome aqui..." required><br><br>
        <input class="coisa-bonita" type="email" id="email" name="email" placeholder="Digite seu email..." required><br><br>
        <input class="coisa-bonita" type="password" id="senha" name="senha" placeholder="Digite sua senha..." required><br><br>
        
        <input class="coisa-bonita" type="submit" value="Cadastrar">
    </form>
{% if nome == "admin" and email == "admin@admin.com" and senha == "admin" %}
    <h3 class="coisa-bonita">Usuário cadastrado com sucesso!</h3>
    <p class="coisa-bonita">Nome: {{ nome }}</p>
    <p class="coisa-bonita">Email: {{ email }}</p>
{% else %}
    <h3></h3>
{% endif %}
</body>
</html>
